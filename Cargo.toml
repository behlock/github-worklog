[package]
name = "github-worklog"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "CLI tool that fetches daily GitHub commits and PRs and generates markdown summaries"
authors = ["wbehlock"]
license = "MIT"
repository = "https://github.com/behlock/github-worklog"

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
futures = "0.3"

# HTTP (GitHub + LLM providers)
reqwest = { version = "0.13", features = ["json", "query"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Configuration
dotenvy = "0.15"
dirs = "6"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Errors
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[[bin]]
name = "github-worklog"
path = "src/main.rs"

[lib]
name = "github_worklog"
path = "src/lib.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"
