[package]
name = "github-daily-recap"
version = "0.1.0"
edition = "2021"
description = "CLI tool that fetches daily GitHub commits and PRs and generates markdown summaries"
authors = ["wbehlock"]
license = "MIT"

[dependencies]
# CLI Framework
clap = { version = "4.5", features = ["derive", "env"] }

# Async Runtime
tokio = { version = "1", features = ["full"] }

# GitHub API Client
octocrab = "0.44"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Configuration
dotenvy = "0.15"
directories = "5.0"
dirs = "5.0"

# URL encoding
urlencoding = "2.1"

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Error Handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async utilities
futures = "0.3"

# HTTP client for Claude API
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.24"

[[bin]]
name = "github-daily-recap"
path = "src/main.rs"

[lib]
name = "github_daily_recap"
path = "src/lib.rs"
